# PyTorch CNN 实验：simple_cnn 在 MNIST 上做监督图像分类。
# 和本仓其它实验最大的不同——这里没有 defaults 继承：pytorch recipe 的配置是平铺的，
# 没有上游配置树要对齐，每个键都由 recipe 声明，所以拼错在 `sf validate` 就报，不必等 GPU。
#
# ══════════════════════════════════════════════════════════════════════════
#  调参速查 —— 你主要动【① 调参区】。硬件由 sf submit --profile 下发，不在这。
#  本实验目标：单卡即可（--profile <卡>:1）。默认配置几分钟跑到 ~99%。
# ──────────────────────────────────────────────────────────────────────────
#  learning_rate            学习率。AdamW 上 1e-3 是 MNIST 的常用起点
#  epochs / max_steps       训几轮 / 步数上限（max_steps 设了就优先，用来做限时演示）
#  batch_size               **每进程**，全局 batch = 该值 × 卡数
#  arch                     simple_cnn，或任意 torchvision.models 构造器（resnet18 等）
#  input_pipeline           构建哪个 loader：mnist / cifar10 / imagefolder
#  完整参数表：sf methods pytorch/image-classification
# ══════════════════════════════════════════════════════════════════════════

# ───────────────────────────── ① 调参区（按需改）─────────────────────────────
learning_rate: 1.0e-3
epochs: 3
batch_size: 128
optimizer: adamw
weight_decay: 0.0
lr_scheduler: step
amp: true

# ───────────────────────────── ② 模型与数据 ──────────────────────────────
# input_pipeline 选的是 train.py 里构建哪个 loader，**不是**数据集引用本身。
# 真正的数据从 --train-dataset 进来（见 README），平台把它拉进共享缓存后
# 由 adapter 以 --data-dir 传给 train.py。
input_pipeline: mnist
arch: simple_cnn
num_classes: 10
num_workers: 4

# ───────────────────────────── ③ 观测与保存 ──────────────────────────────
# log_interval 是上报 train/loss 的步间隔；MNIST 一个 epoch 才 469 步（batch 128），
# 设小一点曲线才有形状。
log_interval: 10
eval_interval_epochs: 1
seed: 0
