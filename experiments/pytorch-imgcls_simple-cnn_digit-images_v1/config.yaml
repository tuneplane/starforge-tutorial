# PyTorch CNN 实验：训练**你自己上传的图片**（一张张 PNG，按类别分目录）。
# 和 pytorch-imgcls_simple-cnn_mnist_v1 是同一个方法、同一份 train.py，差别只有数据形态：
# 那个读 MNIST 原生的 idx 二进制，这个读 ImageFolder —— 也就是你把照片按类别分好目录的样子。
#
# ══════════════════════════════════════════════════════════════════════════
#  调参速查 —— 硬件由 sf submit --profile 下发，不在这。单卡即可。
#  完整参数表：sf methods pytorch/image-classification
# ══════════════════════════════════════════════════════════════════════════

# ───────────────────────────── ① 调参区（按需改）─────────────────────────────
learning_rate: 1.0e-3
epochs: 5
batch_size: 64
optimizer: adamw
weight_decay: 0.0
lr_scheduler: cosine
amp: true

# ───────────────────────────── ② 模型与数据 ──────────────────────────────
# imagefolder 读 <data_dir>/{train,val}/<类名>/*。
# data_dir 从哪来？提交时 --train-dataset <你>/digit-images@v1，平台把该版本拉进共享缓存，
# adapter 再以 --data-dir 传给 train.py —— 实验本身不需要知道路径。
# （教程仓库不能写死某个人的用户名，否则这里应该写 data.train.dataset）
input_pipeline: imagefolder
num_classes: 10
arch: simple_cnn
num_workers: 4

# ───────────────────────────── ③ 观测与保存 ──────────────────────────────
# 2000 张 / batch 64 = 一个 epoch 才 32 步，log_interval 必须小，否则曲线只有几个点。
log_interval: 5
eval_interval_epochs: 1
seed: 0
